<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10141C">
<title>TraceGraph — Ask &amp; Inspect</title>
<style>
  :root {
    --bg: #10141C; --surface: #171C26; --surface-2: #1B2130; --surface-3: #232B3D;
    --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.17);
    --text: #E6E9EF; --dim: #9CA6BA; --muted: #6B7488;
    --accent: #6D5BD0; --accent-ink: #A78BFA; --accent-soft: rgba(167,139,250,0.16);
    --good: #34D399; --good-soft: rgba(52,211,153,0.14);
    --warn: #F5B942; --warn-soft: rgba(245,185,66,0.14);
    --person: #5AC8FA; --doc: #A78BFA; --claim: #34D399; --span: #F472B6;
    --radius: 16px; --radius-sm: 10px; --radius-xs: 7px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.45), 0 1px 1px rgba(0,0,0,.3);
    --shadow-md: 0 14px 32px -12px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.35);
    --shadow-lg: 0 28px 56px -18px rgba(0,0,0,.7), 0 8px 20px -6px rgba(0,0,0,.45);
    --shadow-inset-sm: inset 0 1px 1px rgba(255,255,255,.05);
    --focus-ring: 0 0 0 4px var(--accent-soft);
    /* Spacing scale — used inside cards/panels/tiles/claims so padding and
       stacked-margin choices read as one deliberate rhythm instead of ad hoc
       8/12/14/16/20px values scattered per element. */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 28px; --space-7: 40px;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, Cambria, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --ease: cubic-bezier(.22,.68,0,1);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.6 var(--sans);
    -webkit-font-smoothing: antialiased;
    position: relative;
    animation: pageIn .5s var(--ease) both;
  }
  body::before, body::after {
    content: ""; position: fixed; z-index: -1; border-radius: 50%;
    filter: blur(90px); pointer-events: none; opacity: .22;
  }
  body::before {
    width: 520px; height: 520px; top: -180px; right: -140px;
    background: radial-gradient(circle at 30% 30%, #6D5BD0, transparent 70%);
  }
  body::after {
    width: 460px; height: 460px; bottom: -200px; left: -160px;
    background: radial-gradient(circle at 60% 40%, #17B4D6, transparent 70%);
  }
  ::selection { background: var(--accent-soft); color: var(--accent-ink); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  header {
    display: flex; align-items: center; gap: 24px; padding: 16px 28px;
    border-bottom: 1px solid var(--line);
    background: rgba(16,20,28,0.82); backdrop-filter: blur(10px);
    position: sticky; top: 0; z-index: 5; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--sans); font-size: 18px; font-weight: 700; letter-spacing: -0.01em;
  }
  .brand .mark {
    width: 20px; height: 20px; border-radius: 6px; background: var(--accent);
    display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    box-shadow: 0 0 0 0 var(--accent-soft);
    animation: pulseRing 2.6s ease-out infinite;
  }
  .brand .mark i {
    display: block; width: 6px; height: 6px; border-radius: 50%; background: #fff;
  }
  .brand span {
    color: var(--muted); font-family: var(--sans); font-weight: 400; font-size: 12.5px;
    margin-left: 4px; letter-spacing: 0.01em;
  }
  .stats { display: flex; gap: var(--space-5); margin-left: auto; flex-wrap: wrap;
           background: var(--surface); border: 1px solid var(--line);
           border-radius: var(--radius-sm); padding: var(--space-2) var(--space-4);
           box-shadow: var(--shadow-sm); }
  .stat { padding-left: var(--space-4); border-left: 1px solid var(--line); }
  .stat:first-child { padding-left: 0; border-left: 0; }
  .stat .k { color: var(--muted); font-size: 10px; text-transform: uppercase;
             letter-spacing: 0.08em; font-weight: 600; }
  .stat .v { font-family: var(--mono); font-size: 14px; font-weight: 650;
             color: var(--text); margin-top: 2px; font-variant-numeric: tabular-nums; }

  main { display: grid; grid-template-columns: 1.05fr 1fr; gap: 20px;
         padding: 28px 28px 56px; align-items: start; max-width: 1320px; margin: 0 auto; }
  main > section { min-width: 0; }
  @media (max-width: 1080px) { main { grid-template-columns: 1fr; } }

  .panel {
    min-width: 0;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); box-shadow: var(--shadow-sm);
    transition: box-shadow .25s var(--ease), border-color .25s var(--ease), transform .25s var(--ease);
  }
  .panel:hover { box-shadow: var(--shadow-md); border-color: var(--line-strong); }
  .panel > h2 { margin: 0; padding: var(--space-4) var(--space-5); font-size: 11.5px; font-weight: 650;
                text-transform: uppercase; letter-spacing: 0.08em; font-family: var(--sans);
                color: var(--muted); border-bottom: 1px solid var(--line); }
  .body { padding: var(--space-5); }

  form { display: flex; gap: 10px; }
  input[type=text] {
    flex: 1; background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--radius-sm); color: var(--text); padding: 12px 15px; font-size: 14.5px;
    transition: border-color .2s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    font-family: var(--sans);
  }
  input[type=text]::placeholder { color: var(--muted); }
  input[type=text]:focus {
    outline: none; border-color: var(--accent); background: var(--surface);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }
  button {
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 12px 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    font-family: var(--sans); letter-spacing: 0.01em;
    transition: transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease);
    box-shadow: var(--shadow-sm);
  }
  button:hover:not(:disabled) { background: var(--accent-ink); transform: translateY(-1px); box-shadow: var(--shadow-md); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.6; cursor: default; transform: none; }

  .examples { display: flex; gap: var(--space-2); margin-top: var(--space-4); flex-wrap: wrap; }
  .chip {
    background: var(--surface-2); border: 1px solid var(--line); color: var(--dim);
    border-radius: 999px; padding: 7px 15px; font-size: 12.5px; cursor: pointer;
    font-family: var(--sans); letter-spacing: 0.01em; box-shadow: var(--shadow-sm);
    transition: all .18s var(--ease);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-soft);
                transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .chip:active { transform: translateY(0); }
  .chip:focus-visible, .tab:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 999px; }

  .badge {
    display: inline-flex; align-items: center; gap: 7px; border-radius: 999px;
    padding: 6px 15px; font-size: 12px; font-weight: 650; letter-spacing: 0.01em;
    border: 1px solid transparent; box-shadow: var(--shadow-sm);
    animation: fadeInUp .4s var(--ease) both;
  }
  .badge.supported { color: var(--good); background: var(--good-soft); }
  .badge.insufficient { color: var(--dim); background: var(--surface-2); }
  .badge.conflicting { color: var(--warn); background: var(--warn-soft); }

  .meter { height: 6px; background: var(--surface-2); border-radius: 4px;
           overflow: hidden; margin-top: var(--space-3); box-shadow: var(--shadow-inset-sm); }
  .meter > i { display: block; height: 100%; border-radius: 4px;
               background: linear-gradient(90deg, var(--accent-ink), var(--accent));
               transition: width .7s var(--ease); }
  .answer { margin: var(--space-4) 0; font-size: 15.5px; line-height: 1.75; font-family: var(--sans); }
  .eyebrow { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase;
             letter-spacing: 0.06em; font-family: var(--sans); margin: var(--space-5) 0 var(--space-3); }
  .eyebrow:first-child { margin-top: 0; }
  .eyebrow.warn { color: var(--warn); }
  .cite { font-family: var(--mono); font-size: 11.5px; color: var(--accent-ink);
          overflow-wrap: anywhere; word-break: break-word; }
  ul.plain { list-style: none; margin: 0; padding: 0; }

  .claim { border: 1px solid var(--line); border-left: 3px solid var(--claim);
           background: var(--surface-2); padding: var(--space-3) var(--space-4);
           margin-bottom: var(--space-3); border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
           transition: background .18s var(--ease), border-color .18s var(--ease),
                       box-shadow .18s var(--ease), transform .18s var(--ease);
           animation: fadeInUp .4s var(--ease) both; }
  .claim:hover { background: var(--surface); border-color: var(--line-strong);
                 box-shadow: var(--shadow-sm); transform: translateX(2px); }
  .claim .t { color: var(--dim); font-size: 13px; }
  /* Examined evidence is deliberately quieter than supporting evidence: it is
     what the system rejected, and it must not read as though it backed an
     answer. A dashed rule rather than the solid claim rule says "considered". */
  .examined .claim { border-left: 3px dashed var(--line-strong); opacity: 0.62; }
  .examined .claim:hover { transform: none; }
  .contested-claim { border-left-color: var(--warn); background: var(--warn-soft); }
  .pathline { font-size: 11px; color: var(--accent-ink); margin-top: 4px;
              font-family: var(--mono); overflow-wrap: anywhere; word-break: break-word; }
  .quote { color: var(--muted); font-size: 12.5px; font-style: italic;
           margin-top: 5px; font-family: var(--serif); }

  .tabs { display: flex; gap: var(--space-1); padding: var(--space-3) var(--space-3) 0;
          border-bottom: 1px solid var(--line); }
  .tab { background: none; border: 0; color: var(--muted); padding: var(--space-3) var(--space-4);
         font-size: 12.5px; cursor: pointer; border-bottom: 2px solid transparent;
         border-radius: var(--radius-xs) var(--radius-xs) 0 0;
         font-family: var(--sans); font-weight: 550; letter-spacing: 0.01em;
         transition: color .18s var(--ease), border-color .18s var(--ease), background .18s var(--ease); }
  .tab:hover { color: var(--text); background: var(--surface-2); }
  .tab[aria-selected=true] { color: var(--accent-ink); border-bottom-color: var(--accent); }
  .tab[aria-selected=true]:hover { background: var(--accent-soft); }

  pre { font-family: var(--mono); font-size: 11.5px; color: var(--dim);
        background: var(--surface-2); padding: 12px; border-radius: var(--radius-sm);
        overflow-x: auto; margin: 0 0 10px; border: 1px solid var(--line);
        white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; }
  table { width: 100%; max-width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
           overflow-wrap: anywhere; word-break: break-word; }
  th { color: var(--muted); font-weight: 600; font-size: 10.5px;
       text-transform: uppercase; letter-spacing: 0.05em; }
  tr { animation: fadeInUp .35s var(--ease) both; }
  tbody tr:hover, table tr:hover td { background: var(--surface-2); }

  .bar { height: 5px; background: var(--surface-2); border-radius: 3px; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 3px;
             transition: width .6s var(--ease); }
  .muted { color: var(--muted); }
  .empty { color: var(--muted); padding: 34px 4px; text-align: center; font-size: 13px;
           font-family: var(--serif); font-style: italic; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: var(--muted);
            margin-top: 10px; flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
         margin-right: 5px; vertical-align: middle; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #ffffff55;
             border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pageIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseRing {
    0% { box-shadow: 0 0 0 0 var(--accent-soft); }
    70% { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }

  .trace-tiles { display: flex; gap: var(--space-3); margin-bottom: var(--space-4); flex-wrap: wrap; }
  .trace-tile { flex: 1; min-width: 168px; background: var(--surface-2);
                border: 1px solid var(--line); border-left: 3px solid var(--line);
                border-radius: var(--radius-sm); padding: var(--space-4) var(--space-4) var(--space-4) var(--space-5);
                box-shadow: var(--shadow-sm);
                transition: transform .18s var(--ease), box-shadow .18s var(--ease), border-color .18s var(--ease);
                animation: fadeInUp .4s var(--ease) both; }
  .trace-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
  .trace-tile .n { font-family: var(--mono); font-size: 27px; font-weight: 700; line-height: 1.1;
                    letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
  .trace-tile .l { color: var(--dim); font-size: 11px; text-transform: uppercase;
                   letter-spacing: 0.06em; margin-top: var(--space-2); font-weight: 650; }
  .trace-tile .d { color: var(--muted); font-size: 11.5px; margin-top: var(--space-2); line-height: 1.5; }
  .trace-stackbar { display: flex; height: 10px; border-radius: 5px; overflow: hidden;
                     margin: 2px 0 10px; background: var(--surface-2); gap: 1px; }
  .trace-stackbar > i { display: block; height: 100%; transition: width .5s var(--ease); }
  .trace-strip { display: flex; gap: 18px; flex-wrap: wrap; font-size: 11.5px;
                 color: var(--muted); margin-top: 10px; padding-top: 10px;
                 border-top: 1px solid var(--line); animation: fadeInUp .45s var(--ease) both; }
  .trace-strip a { color: var(--accent-ink); cursor: pointer; text-decoration: underline;
                    text-decoration-color: var(--accent-soft); text-underline-offset: 2px;
                    transition: text-decoration-color .18s var(--ease); }
  .trace-strip a:hover { text-decoration-color: var(--accent-ink); }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark"><i></i></span>TraceGraph <span>enterprise truth debugger on HydraDB</span></div>
  <div class="stats" id="stats"></div>
</header>

<main>
  <section>
    <div class="panel">
      <h2>Ask</h2>
      <div class="body">
        <form id="askForm">
          <input type="text" id="q" autocomplete="off"
                 placeholder="Ask about people, projects, decisions, conflicts…">
          <button id="askBtn" type="submit">Ask</button>
        </form>
        <div class="examples" id="examples"></div>
      </div>
    </div>

    <div class="panel" id="answerPanel" style="margin-top:20px; display:none">
      <h2>Answer</h2>
      <div class="body" id="answer"></div>
    </div>
  </section>

  <section class="panel">
    <div class="tabs" role="tablist">
      <button class="tab" data-tab="graph" role="tab" aria-selected="true">Evidence graph</button>
      <button class="tab" data-tab="resolution" role="tab" aria-selected="false">Entity resolution</button>
      <button class="tab" data-tab="conflicts" role="tab" aria-selected="false">Conflicts</button>
      <button class="tab" data-tab="trace" role="tab" aria-selected="false">HydraDB trace</button>
    </div>
    <div class="body" id="inspect">
      <div class="empty">Ask a question to populate the evidence graph.</div>
    </div>
  </section>
</main>

<script>
const KIND_COLOUR = { Document: "var(--doc)", Claim: "var(--claim)",
                      EvidenceSpan: "var(--span)", Entity: "var(--person)" };
const EXAMPLES = [
  "What did Redwood commit to for SOC 2 and audit evidence?",
  "Interview slate and role anchors for the Staff Inference Engineer opening",
  "What is the Q4 2029 revenue target for the Antarctic division?",
];
let current = null, tab = "graph";

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

async function get(url) { const r = await fetch(url); if (!r.ok) throw new Error(await r.text()); return r.json(); }

// The headline number for this whole demo: how much of the wall clock was
// HydraDB doing real graph work versus an LLM extracting claims from a
// document it had never seen. Enrichment runs concurrently across up to a
// few documents, so its wall-clock contribution is the slowest one, not the
// sum — the sum is shown too, but only ever as "of LLM work", never added
// into the total, so the numbers don't silently double-count time.
function traceSummary(t) {
  const queries = t.queries || [];
  const ingested = t.ingested_on_demand || [];
  const hydraMs = queries.reduce((s, q) => s + (q.latency_ms || 0), 0);
  const enrichSumMs = ingested.reduce((s, d) => s + (d.seconds || 0) * 1000, 0);
  const enrichWallMs = ingested.reduce((m, d) => Math.max(m, (d.seconds || 0) * 1000), 0);
  const totalMs = t.latency_ms || 0;
  const otherMs = Math.max(0, totalMs - hydraMs - enrichWallMs);
  return {
    hydraS: hydraMs / 1000, enrichWallS: enrichWallMs / 1000, enrichSumS: enrichSumMs / 1000,
    otherS: otherMs / 1000, totalS: totalMs / 1000, docCount: ingested.length,
  };
}

// A one-line version of the same split, shown right under the answer so a
// demo audience never has to click into "HydraDB trace" to see that the
// graph was fast — it's the sentence this whole project is trying to prove.
function renderTraceStrip(t) {
  if (!t) return "";
  const s = traceSummary(t);
  const enrich = s.docCount
    ? `${s.enrichWallS.toFixed(1)}s enriching ${s.docCount} new doc${s.docCount === 1 ? "" : "s"} (parallel)`
    : `0 new docs to enrich`;
  return `
    <div class="trace-strip">
      <span><i class="dot" style="background:var(--good)"></i>${s.hydraS.toFixed(1)}s in HydraDB
        (${t.query_count} quer${t.query_count === 1 ? "y" : "ies"})</span>
      <span><i class="dot" style="background:var(--warn)"></i>${esc(enrich)}</span>
      <span><i class="dot" style="background:var(--line)"></i>${s.otherS.toFixed(1)}s synthesis/overhead</span>
      <a data-goto-trace="1">full trace →</a>
    </div>`;
}

async function loadStatus() {
  try {
    const s = await get("/api/status");
    const n = s.nodes, e = s.edges;
    document.getElementById("stats").innerHTML = [
      ["documents", n.Document], ["entities", n.Entity], ["claims", n.Claim],
      ["spans", n.EvidenceSpan], ["conflicts", e.CONFLICTS_WITH],
      ["read epoch", s.consistency.read_epoch],
    ].map(([k, v]) => `<div class="stat"><div class="k">${k}</div>
        <div class="v">${Number(v).toLocaleString()}</div></div>`).join("");
  } catch (err) {
    document.getElementById("stats").innerHTML =
      `<div class="stat"><div class="k">graph</div><div class="v">unreachable</div></div>`;
  }
}

function renderExamples() {
  document.getElementById("examples").innerHTML = EXAMPLES
    .map((q, i) => `<button class="chip" data-i="${i}">${esc(q.slice(0, 58))}…</button>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
    document.getElementById("q").value = EXAMPLES[+c.dataset.i];
    ask(EXAMPLES[+c.dataset.i]);
  });
}

async function ask(question) {
  const btn = document.getElementById("askBtn");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  document.getElementById("answerPanel").style.display = "";
  document.getElementById("answer").innerHTML =
    `<div class="muted">retrieving entry points, walking the graph, checking every span…</div>`;
  try {
    const r = await fetch("/api/ask", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    current = await r.json();
    renderAnswer(); renderInspect();
  } catch (err) {
    document.getElementById("answer").innerHTML =
      `<div class="muted">request failed: ${esc(err.message)}</div>`;
  } finally { btn.disabled = false; btn.textContent = "Ask"; }
}

function renderAnswer() {
  const d = current, a = d.answerability;
  const label = { supported: "✓ Supported", insufficient: "⊘ Insufficient — abstained",
                  conflicting: "⚠ Conflicting" }[a] || a;
  const cites = (d.document_ids || []).map(x =>
    `<li class="cite">${esc(x)}</li>`).join("");
  const card = c => `
    <div class="claim">
      <div class="t"><strong>${esc(c.subject)}</strong> — ${esc(c.predicate)} — ${esc(c.object)}</div>
      <div class="quote">“${esc((c.quote || "").slice(0, 150))}”</div>
      <div class="cite">${esc(c.dsid)}</div>
    </div>`;
  const claims = (d.claims || []).slice(0, 5).map(card).join("");

  // What an abstention looked at is shown apart from what an answer rests on.
  // These are rendered from `examined`, never `claims`: the page used to fall
  // back to whatever retrieval had gathered, so an abstention arrived under the
  // heading "Supporting claims" with document ids beside it — reading as
  // evidence for the answer the system had just declined to give.
  const examined = (d.examined || []).slice(0, 5).map(card).join("");
  const looked = (d.examined_documents || []).length;

  // What the answer stands on that some other document disputes. Found by a
  // one-hop CONFLICTS_WITH walk from the cited claims, so the page is showing a
  // disagreement the graph holds rather than one composed here. An answer built
  // on a contested fact must not read as settled.
  const alts = (d.alternatives || []).slice(0, 5);
  const contested = alts.length ? `
    <h3 class="eyebrow warn">Contested — ${alts.length} fact(s) another document disagrees with</h3>
    ${alts.map(a => `
      <div class="claim contested-claim">
        <div class="t"><strong>${esc(a.subject)}</strong> — ${esc(a.predicate)}</div>
        <div><span class="muted">cited&nbsp;</span>${esc(String(a.cited_value).slice(0, 90))}
             <span class="cite">${esc(a.cited_dsid)}</span></div>
        <div><span class="muted">rival&nbsp;</span>${esc(String(a.rival_value).slice(0, 90))}
             <span class="cite">${esc(a.rival_dsid)}</span></div>
        <div class="muted" style="font-size:11px">${
          a.decided ? `graph favours one version, margin ${a.margin}`
                    : "evidence does not decide between them"}</div>
      </div>`).join("")}` : "";

  document.getElementById("answer").innerHTML = `
    <span class="badge ${a}">${label}</span>
    <div class="meter"><i style="width:${Math.round((d.confidence || 0) * 100)}%"></i></div>
    <div class="muted" style="font-size:12px;margin-top:6px">
      confidence ${d.confidence} · ${d.document_ids.length} validated citation(s)
      ${d.rejected_spans ? ` · ${d.rejected_spans} span(s) rejected as no longer verbatim` : ""}
    </div>
    ${renderTraceStrip(d.hydradb_trace)}
    <div class="answer">${esc(d.answer)}</div>
    ${cites ? `<h3 class="eyebrow">Citations</h3>
               <ul class="plain">${cites}</ul>` : ""}
    ${claims ? `<h3 class="eyebrow">Supporting claims — every span verified verbatim in its source</h3>${claims}` : ""}
    ${examined ? `<h3 class="eyebrow">Examined and not relied on — ${looked} document(s) reached, none supporting an answer</h3>
                 <div class="examined">${examined}</div>` : ""}
    ${contested}`;
}

function renderGraph() {
  const g = (current && current.evidence_graph) || { nodes: [], edges: [] };
  if (!g.nodes.length) {
    const looked = (current && (current.examined_documents || []).length) || 0;
    return `<div class="empty">No evidence subgraph. The system abstained, so
      there is no supported answer for a subgraph to stand behind${
        looked ? ` — ${looked} document(s) were reached and none supported one` : ""}.</div>`;
  }
  const cols = { Document: 60, Claim: 250, EvidenceSpan: 470 };
  const rows = {}; const pos = {};
  g.nodes.forEach(n => { rows[n.kind] = (rows[n.kind] || 0); pos[n.id] = { x: cols[n.kind] ?? 60, y: 34 + rows[n.kind] * 44 }; rows[n.kind]++; });
  const h = Math.max(...Object.values(rows)) * 44 + 50;
  const edges = g.edges.map(e => {
    const a = pos[e.source], b = pos[e.target];
    if (!a || !b) return "";
    return `<path d="M${a.x + 96} ${a.y} C ${a.x + 150} ${a.y}, ${b.x - 50} ${b.y}, ${b.x} ${b.y}"
             fill="none" stroke="var(--line)" stroke-width="1.4"/>`;
  }).join("");
  const nodes = g.nodes.map(n => `
    <g transform="translate(${pos[n.id].x},${pos[n.id].y})">
      <rect x="0" y="-13" rx="6" width="96" height="26" fill="var(--surface-2)"
            stroke="${KIND_COLOUR[n.kind] || "var(--line)"}" stroke-width="1.4"/>
      <circle cx="11" cy="0" r="3.5" fill="${KIND_COLOUR[n.kind] || "#888"}"/>
      <text x="21" y="4" font-size="9.5" fill="var(--dim)">${esc(n.label.slice(0, 13))}</text>
      <title>${esc(n.kind)}: ${esc(n.label)}</title>
    </g>`).join("");
  return `<svg viewBox="0 0 600 ${h}" width="100%" height="${Math.min(h, 420)}">${edges}${nodes}</svg>
    <div class="legend">
      <span><i class="dot" style="background:var(--doc)"></i>Document</span>
      <span><i class="dot" style="background:var(--claim)"></i>Claim</span>
      <span><i class="dot" style="background:var(--span)"></i>EvidenceSpan</span>
      <span class="muted">bounded to cited documents, 2 hops</span>
    </div>`;
}

async function renderResolution() {
  const d = await get("/api/resolution?limit=6");
  // The path is the engine's own answer, not a sentence composed here: it comes
  // back from `algo.SPpaths` as a whole path, so what this shows and what the
  // graph holds cannot drift apart. Absent when the identity has no recorded
  // participation to path through, and shown as absent rather than invented.
  // The engine's own path, element by element, rather than a summary of it —
  // otherwise the panel is showing this page's description of a traversal
  // instead of the traversal. `hops` counts relationships, not list elements:
  // a one-hop walk comes back as three elements and must not read as three hops.
  const path = e => {
    if (!e.path || !e.path.steps || !e.path.steps.length) return "";
    const rendered = e.path.steps.map(s => s.kind === "relationship"
      ? `<span class="muted">—${esc(s.label)}→</span>`
      : `<strong>${esc(s.label)}</strong>`).join(" ");
    return `<div class="pathline">${rendered}
       <span class="muted">· ${esc(e.path.procedure)}, ${e.path.hops} hop${
         e.path.hops === 1 ? "" : "s"}</span></div>`;
  };
  const resolved = d.resolved.map(e => `
    <tr><td><strong>${esc(e.name)}</strong><div class="muted" style="font-size:11px">
      ${e.surfaces.length} distinct surfaces</div>${path(e)}</td>
      <td>${e.surfaces.slice(0, 4).map(s =>
        `<div><span class="cite">${esc(s.surface.slice(0, 30))}</span>
         <span class="muted"> ${esc(s.method)} ${s.confidence}</span></div>`).join("")}</td></tr>`).join("");
  const unresolved = d.unresolved.map(u => `
    <tr><td><span class="cite">${esc(u.surface)}</span></td>
        <td class="muted">${u.candidates} candidates — kept unresolved</td></tr>`).join("");
  return `<h3 class="eyebrow">Resolved — several surfaces, one entity</h3>
          <table><tr><th>entity</th><th>surfaces and method</th></tr>${resolved}</table>
          <h3 class="eyebrow">Left ambiguous on purpose</h3>
          <table><tr><th>surface</th><th>why</th></tr>${unresolved}</table>`;
}

async function renderConflicts() {
  const d = await get("/api/conflicts?limit=5");
  if (!d.conflicts.length) return `<div class="empty">No contested facts in this run.</div>`;
  const blocks = d.conflicts.map(c => `
    <div style="margin-bottom:var(--space-6)">
      <div><strong>${esc(c.subject)}</strong>
        <span class="muted"> — ${esc(c.predicate)}${c.mutable ? " (mutable)" : ""}</span>
        ${c.decided ? `<span class="badge supported" style="margin-left:var(--space-2)">best supported</span>`
                    : `<span class="badge conflicting" style="margin-left:var(--space-2)">no winner declared</span>`}</div>
      <table style="margin-top:var(--space-2)">
        <tr><th>version</th><th>trust</th><th>sources</th></tr>
        ${c.versions.slice(0, 4).map(v => `
          <tr>
            <td>${v.best_supported ? "★ " : ""}${esc(v.value.slice(0, 42))}</td>
            <td style="width:110px">
              <div class="bar"><i style="width:${Math.round(v.trust.score * 100)}%"></i></div>
              <span class="muted" style="font-size:11px">${v.trust.score}</span></td>
            <td class="muted">${esc(v.sources.join(", "))}</td>
          </tr>`).join("")}
      </table>
      <div class="muted" style="font-size:12px;margin-top:6px">${esc(c.reason)}</div>
    </div>`).join("");
  return `<div class="muted" style="font-size:12px;margin-bottom:14px">
      ${d.stats.conflicts_found} contested facts · ${d.stats.decided} with a best-supported version ·
      ${d.stats.unmapped_predicates} predicates unmapped and queued</div>${blocks}`;
}

function renderTrace() {
  if (!current) return `<div class="empty">Ask a question to see the trace.</div>`;
  const t = current.hydradb_trace, c = t.consistency;
  const s = traceSummary(t);
  // Segment widths are wall-clock seconds, not summed LLM-worker seconds, so
  // the three segments actually add up to the total bar — the point being
  // made here is what the *user* waited for, not how much compute happened.
  const pct = sec => s.totalS > 0 ? Math.max(0, (sec / s.totalS) * 100) : 0;
  const enrichNote = s.docCount
    ? `${s.docCount} new document${s.docCount === 1 ? "" : "s"} enriched, concurrently —
       wall time is the slowest of them; Σ${s.enrichSumS.toFixed(1)}s of LLM work total,
       not additive`
    : `0 documents enriched — every claim already existed in the graph`;
  return `
    <div class="trace-tiles">
      <div class="trace-tile" style="border-left-color:var(--good)">
        <div class="n" style="color:var(--good)">${s.hydraS.toFixed(1)}s</div>
        <div class="l">Time in HydraDB</div>
        <div class="d">${t.query_count} quer${t.query_count === 1 ? "y" : "ies"} · max ${t.hops} hops ·
          real graph traversals, individually timed</div>
      </div>
      <div class="trace-tile" style="border-left-color:var(--warn)">
        <div class="n" style="color:var(--warn)">${s.enrichWallS.toFixed(1)}s</div>
        <div class="l">Enriching new docs (wall)</div>
        <div class="d">${enrichNote}</div>
      </div>
      <div class="trace-tile" style="border-left-color:var(--line)">
        <div class="n" style="color:var(--dim)">${s.otherS.toFixed(1)}s</div>
        <div class="l">Synthesis &amp; overhead</div>
        <div class="d">final-answer generation and request plumbing</div>
      </div>
    </div>
    <div class="trace-stackbar">
      <i style="width:${pct(s.hydraS)}%;background:var(--good)"
         title="HydraDB queries: ${s.hydraS.toFixed(1)}s"></i>
      <i style="width:${pct(s.enrichWallS)}%;background:var(--warn)"
         title="Document enrichment (wall): ${s.enrichWallS.toFixed(1)}s"></i>
      <i style="width:${pct(s.otherS)}%;background:var(--line-strong)"
         title="Synthesis & overhead: ${s.otherS.toFixed(1)}s"></i>
    </div>
    <div class="muted" style="font-size:11.5px;margin-bottom:18px">
      ${s.totalS.toFixed(1)}s wall total — HydraDB's own graph work
      (${s.totalS > 0 ? Math.round(s.hydraS / s.totalS * 100) : 0}% of it) is the fast part;
      ${s.docCount
        ? "the LLM calls extracting claims from documents seen for the first time are the slow part."
        : "there was nothing new to enrich this time, so the whole answer came straight from the graph."}
    </div>
    <table>
      <tr><th>operation</th><th>hops</th><th>rows</th><th>ms</th></tr>
      ${t.queries.map(q => `<tr><td class="cite">${esc(q.operation)}</td>
        <td>${q.hops}</td><td>${q.results}</td><td>${q.latency_ms}</td></tr>`).join("")}
    </table>
    <div class="muted" style="font-size:12px;margin:14px 0 8px">
      ${t.query_count} queries · max ${t.hops} hops · ${t.latency_ms} ms total</div>
    <pre>transport        ${esc(c.transport)}
read_epoch       ${c.read_epoch}
storage_sequence ${c.storage_sequence}
bookmark         ${esc(c.bookmark || "")}</pre>
    <div class="muted" style="font-size:11.5px">
      Read epoch and bookmark are taken from the engine's own response, not composed here.</div>
    <pre>${esc((t.queries[t.queries.length - 1] || {}).cypher || "")}</pre>`;
}

async function renderInspect() {
  const el = document.getElementById("inspect");
  el.innerHTML = `<div class="empty">loading…</div>`;
  try {
    if (tab === "graph") el.innerHTML = renderGraph();
    else if (tab === "resolution") el.innerHTML = await renderResolution();
    else if (tab === "conflicts") el.innerHTML = await renderConflicts();
    else el.innerHTML = renderTrace();
  } catch (err) { el.innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
}

document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === b));
  tab = b.dataset.tab; renderInspect();
});
// The trace strip under the answer is re-rendered on every ask(), so its
// "full trace →" link is delegated from a stable ancestor rather than bound
// per-render.
document.getElementById("answer").addEventListener("click", e => {
  if (!e.target.closest("[data-goto-trace]")) return;
  document.querySelector('.tab[data-tab="trace"]').click();
});
document.getElementById("askForm").onsubmit = e => {
  e.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (q) {
    history.replaceState(null, "", "?q=" + encodeURIComponent(q));
    ask(q);
  }
};

renderExamples(); loadStatus(); renderInspect();

// A question in the URL asks it on load, and asking one puts it back in the
// URL. An answer is the thing worth sending someone — "run this and type
// this" is not a citation — and reload now reproduces a result rather than
// clearing it.
(function () {
  const params = new URLSearchParams(location.search);

  const wanted = params.get("tab");
  const button = wanted && document.querySelector(`.tab[data-tab="${CSS.escape(wanted)}"]`);
  if (button) {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === button));
    tab = wanted;
    renderInspect();
  }

  const initial = params.get("q");
  if (initial) {
    document.getElementById("q").value = initial;
    ask(initial);
  }
})();
</script>
</body>
</html>
